name: Publish Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    # Diese Datei ist der GitHub-Pfad. Der Build auf mindcode liegt in
    # .forgejo/workflows/publish-container.yml und braucht dort einen
    # Docker-in-Docker-Sidecar, weil der Runner nur das Docker-CLI mitbringt
    # (How To 12.5).
    #
    # Forgejo bevorzugt .forgejo/workflows/ gegenueber .github/workflows/, diese
    # Bedingung sollte dort also gar nicht mehr greifen. Sie bleibt als Netz
    # stehen, damit bei abweichendem Verhalten kein doppelter Build laeuft.
    if: ${{ !contains(github.server_url, 'mindcode') }}
    runs-on: ubuntu-latest
    env:
      # Forgejo (mindcode) fuehrt .github/workflows/ ebenfalls aus. Beide Server
      # bauen dasselbe Image, aber mit unterschiedlichen Zielen und Zugangsdaten:
      #
      #   GitHub  -> ghcr.io UND mindcode   (secrets.GITHUB_TOKEN + MINDCODE_TOKEN)
      #   Forgejo -> nur mindcode           (automatischer Repo-Token)
      #
      # Solange beide laufen, ist der Umzug jederzeit umkehrbar. Faellt GitHub
      # weg, baut Forgejo allein weiter — ohne dass hier etwas geaendert werden
      # muss.
      ON_FORGEJO: ${{ contains(github.server_url, 'mindcode') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ env.ON_FORGEJO == 'false' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to mindcode (von GitHub aus)
        if: ${{ env.ON_FORGEJO == 'false' }}
        uses: docker/login-action@v4
        with:
          registry: mindcode.mindsquare.de
          username: sina.strathemann
          password: ${{ secrets.MINDCODE_TOKEN }}

      - name: Log in to mindcode (lokal auf Forgejo)
        if: ${{ env.ON_FORGEJO == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: mindcode.mindsquare.de
          username: ${{ github.actor }}
          # GITEA_TOKEN stellt Forgejo pro Lauf automatisch bereit. MINDCODE_TOKEN
          # ist der Ausweichweg, falls die Instanz den automatischen Token nicht
          # fuer die Paket-Registry freigibt — dann als Repo-Secret hinterlegen.
          password: ${{ secrets.GITEA_TOKEN || secrets.MINDCODE_TOKEN }}

      - name: Ziel-Registries bestimmen
        id: reg
        run: |
          if [ "${ON_FORGEJO}" = "true" ]; then
            printf 'images<<EOF\nmindcode.mindsquare.de/sina.strathemann/mexp\nEOF\n' >> "$GITHUB_OUTPUT"
          else
            printf 'images<<EOF\nghcr.io/sinastrathemann/mexp\nmindcode.mindsquare.de/sina.strathemann/mexp\nEOF\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=mEXP
            org.opencontainers.image.description=mindsquare Experience Platform

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          provenance: true
