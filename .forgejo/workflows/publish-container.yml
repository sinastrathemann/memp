name: Publish Container

# Docker-in-Docker WORTGETREU nach How To Abschnitt 12.5 -- inklusive der
# --health-*-Optionen und der Adressierung ueber den Service-Namen "docker".
# Frueher bin ich davon abgewichen (Health-Check entfernt, IP-Suche eingebaut);
# das war Interpretation, nicht die Anleitung.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24-dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: >-
          --privileged
          --health-cmd="docker info"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    env:
      DOCKER_HOST: tcp://docker:2375
      IMAGE: mindcode.mindsquare.de/sina.strathemann/mexp
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 20); do
            docker info >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Show docker version
        run: docker version

      - name: Log in to mindcode registry
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN || secrets.MINDCODE_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "Weder GITEA_TOKEN noch MINDCODE_TOKEN gesetzt." >&2
            echo "Secret anlegen: Einstellungen -> Actions -> Secrets -> MINDCODE_TOKEN" >&2
            exit 1
          fi
          echo "${TOKEN}" | docker login mindcode.mindsquare.de \
            -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE}:sha-${SHORT_SHA}" \
            -t "${IMAGE}:latest" \
            --build-arg "APP_VERSION=latest" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://mindcode.mindsquare.de/sina.strathemann/mexp" \
            .

      - name: Smoke-test container
        run: |
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          docker run -d --name mexp-smoke -e AUTH_MODE=hub "${IMAGE}:sha-${SHORT_SHA}"
          for i in $(seq 1 20); do
            docker exec mexp-smoke wget -qO- http://127.0.0.1:3000/health && break
            sleep 2
          done
          docker rm -f mexp-smoke

      - name: Push image
        run: docker push --all-tags "${IMAGE}"
