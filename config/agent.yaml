# ============================================================
# mEXP Agent/Plattform-Konfiguration
# Domaenenspezifische Parameter. Überschreibbar via agent.<env>.yaml + ENV.
# ============================================================
#
# !!! ACHTUNG — DIESE DATEI WIRD DERZEIT VON KEINER CODEZEILE GELESEN !!!
# (Audit-Finding ARC-01)
#
# Saemtliche Werte hier sind aktuell reine Absichtserklaerung. Wer hier etwas
# aendert — Fristen, Freigabegrenzen, Steuerfreibetrag, Rollen — aendert an der
# laufenden Anwendung EXAKT NICHTS. Es gibt keine Fehlermeldung, die darauf
# hinweist. Die tatsaechlich wirksamen Werte stehen hart im Code, verteilt ueber
# apps/api/src/routes/*.ts.
#
# Die Projektdoku (mEXP-Doku.md:119) behauptet das Gegenteil und ist an dieser
# Stelle falsch. Vor produktiver Nutzung muss ein validierter Loader ergaenzt
# werden — das Muster existiert bereits in packages/auth/src/dev-user-config.ts.

app:
  name: "mexp"
  display_name: "mindsquare Experience Platform"
  default_locale: "de"
  supported_locales: ["de", "en"]
  timezone: "Europe/Berlin"

http:
  enabled: true
  port: 3000
  cors:
    origins: ["http://localhost:8080"]
  request_timeout_ms: 30000

# --- Event Lifecycle Defaults (pro Blueprint überschreibbar) ---
event:
  default_registration_deadline_hours: 48
  default_reminder_offsets_hours: [168, 24, 2]   # 1 Woche, 1 Tag, 2 Stunden vor Event
  default_waitlist_enabled: true
  checkin_window_minutes_before: 30
  checkin_window_minutes_after: 60

# --- Budget & Tax ---
budget:
  default_currency: "EUR"
  approval_thresholds_eur:
    team_lead: 500
    manager: 2500
    board: 10000
  tax:
    # !!! NICHT IMPLEMENTIERT (Audit-Finding FUN-02) !!!
    # Es gibt im Code KEINE Berechnung, KEINEN Vergleich gegen diesen Grenzwert
    # und KEINEN Hinweis in der Oberflaeche. Weder der Betrag noch die
    # Warnschwelle haben irgendeine Wirkung.
    #
    # Konkret: mEXP warnt NICHT vor der Ueberschreitung des §19-Freibetrags.
    # Wer sich darauf verlaesst, bemerkt eine Ueberschreitung erst bei der
    # Lohnsteuer-Aussenpruefung — dann rueckwirkend fuer alle Veranstaltungen
    # und alle Teilnehmenden, mit Haftung beim Arbeitgeber.
    #
    # Vor der Umsetzung mit Controlling/Steuerberatung klaeren: Brutto- statt
    # Nettobasis, Divisor = tatsaechlich erschienene Personen, Freibetrag- statt
    # Freigrenzenlogik, Behandlung von Begleitpersonen. Der Schluessel heisst
    # "..._limit_eur", gemeint ist aber ein FREIBETRAG (nur der uebersteigende
    # Teil ist steuerpflichtig) — nicht eine Freigrenze.
    company_event_per_participant_limit_eur: 110.00   # §19 Abs. 1 EStG
    warn_threshold_percent: 90

# --- SLA ---
sla:
  max_response_time_ms: 3000
  min_confidence: 0.7
  escalation:
    type: "human"
    channel: "teams"
    target: "#mexp-escalations"

# --- Queue / Worker ---
queue:
  concurrency:
    reminders: 5
    documents: 2
    exports: 2
    m365_sync: 3
  retries:
    max_attempts: 3
    backoff_ms: 5000

# --- Storage ---
storage:
  provider: "sharepoint"            # "sharepoint" | "s3"
  sharepoint:
    site_id: ${SHAREPOINT_SITE_ID}
    root_folder: "mEXP"
  s3:
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}

# --- Feature Flags ---
features:
  ai_insights: false                 # Phase 4
  tax_simulation: false              # Phase 2+
  powerbi_embed: false               # Phase 3+
  offline_checkin: false             # späterer Ausbau
